source_system_prompt = """
"""
source_user_prompt = """
	Generate synthetic dialogue between Agent, Patient and Caregiver.
	Agent calls, Caregiver takes a phone, Agent wants to know how Patient is feeling. Caregiver describes some issues. Then pass the phone to Patient.
	From now, Agent & Patient talk about how he feels, what needs to be done/organized, how last week went, and about future medical procedures.
	You can invent facts, make sure conversation is natural, long and has a lot of variability.
"""
speakers = [
	"Agent | Marta",
	"Caregiver | Julia | Edward's daughter",
	"Patient | Edward Nowak | Mr. Nowak | Edward | Julia's dad"
]
text = """
	Agent:  Hello, this is Marta from the Home Care Support Program, calling for Mr. Nowak. Am I speaking with Edward?
	Caregiver:  Hi Marta, no, it's Julia, his daughter. Dad's in the other room. I picked up because he never hears the phone.
	Agent:  Hi Julia, good to hear from you. I'm calling for our Friday check-in. How's he been doing this week?
	Caregiver:  Honestly? Mixed. Before I hand him over, I want to tell you a few things, because he'll downplay all of it.
	Agent:  Please, go ahead. That's really helpful.
	Caregiver:  So, the swelling in his ankles is back. Not terrible, but on Tuesday his socks left deep marks and he had trouble getting his shoes on. And he's been getting out of breath on the stairs to the bathroom. He says it's "just age."
	Agent:  Okay. Has he been weighing himself every morning like we discussed?
	Caregiver:  Most days. Monday he was 83.4 kilos, and this morning he was 85.1. I wrote it down on the sheet on the fridge.
	Agent:  That's a gain of 1.7 kilos in four days. I'm going to flag that for the nurse today. Anything else?
	Caregiver:  He didn't sleep well Wednesday and Thursday. He's using two pillows now, and I found him in the armchair at 3 a.m. yesterday. And he skipped his evening pills on Wednesday. He said he forgot, but I think he was just tired of them.
	Agent:  That's important, thank you for telling me. Did he have any dizziness, chest pain, or another fall?
	Caregiver:  No falls since the one two weeks ago. A bit dizzy when he stands up fast, but no chest pain. His appetite is okay. He's actually eating well, a bit too much salty stuff when I'm not looking. I found pickles hidden behind the bread box.
	Agent:  (laughs) The classic. Okay, Julia, I'll talk to him now, and then maybe I can ask you a couple of logistics questions at the end.
	Caregiver:  Sure. Hang on. Dad! It's the lady from the program! Come, sit down, take the phone. No, the other way up. There.
	Patient:  Hello? Hello, who is it?
	Agent:  Hello, Mr. Nowak, it's Marta from the Home Care Support Program. How are you today?
	Patient:  Ah, Marta! The nice one. I'm fine, fine. Can't complain. Well, I can, but nobody listens.
	Agent:  (laughs) I'm listening. Tell me how you're really feeling.
	Patient:  Really? Like an old car. Starts slow in the morning, rattles a bit, but it gets me there.
	Agent:  Julia mentioned your ankles are swollen again and you've been short of breath on the stairs. Is that how it feels to you?
	Patient:  Julia exaggerates. A little swelling, so what. The shoes are tight because I bought them in a hurry, not because of the swelling.
	Agent:  Hmm. Julia said the socks left marks on Tuesday. When you press your finger on your shin, does it leave a dent?
	Patient:  ...Let me check. (pause) Well. A small one. Not big.
	Agent:  Okay, thank you for checking, that helps me. And the breathing? When you climb the stairs, do you have to stop?
	Patient:  I stop once, in the middle. To admire the wallpaper.
	Agent:  (laughs) A very patient wallpaper admirer. How about at night, are you comfortable lying flat?
	Patient:  Not really. I put another pillow under my head. It's better. I fall asleep, then wake up and my chest feels tight, like somebody is sitting on it. Then I go to the armchair and it passes.
	Agent:  That's something I'd like the nurse to hear about, Mr. Nowak. It isn't "just age." It could mean fluid is building up again, and we can adjust your medication to help. Would it be okay if I asked her to call you today?
	Patient:  Do I have to go to hospital? Because I'm not going back there. The food was a crime.
	Agent:  I can't promise anything yet, it depends on what the nurse and the doctor decide. But often it's just a dose change, and you stay home. That's exactly why it's good we caught it now and not next week.
	Patient:  Fine. Fine. She can call.
	Agent:  Thank you. Now, Julia said you missed your evening pills on Wednesday. What happened there?
	Patient:  I forgot. I fell asleep in front of the television. There was a documentary about whales.
	Agent:  Whales are a strong competitor. Do you remember which pills those were?
	Patient:  The little white ones and the... the yellow one. The water one.
	Agent:  The diuretic, yes, the water pill. That one especially matters with the swelling. Is it the taking-them-every-day part that bothers you, or something else, like side effects?
	Patient:  (pause) The water one. I'm in the bathroom all the time. If I take it in the evening, I'm up three times at night. It's humiliating, at my age, shuffling around in the dark.
	Agent:  Thank you for telling me, that's a real issue, and it's fixable. Usually that pill is best taken in the morning. Who told you to take it in the evening?
	Patient:  The hospital. Or maybe I just got used to it.
	Agent:  Let's ask the nurse to confirm with your doctor, and I'm fairly sure we can move it to the morning. That might help your nights, and your fall risk too. Would you like that?
	Patient:  I'd like that very much. Write it down. Julia, write it down!
	Caregiver:  (from further away) I'm writing, Dad!
	Agent:  Good. Let's talk about last week more broadly. How did the physiotherapy go? You had two sessions, I think.
	Patient:  One and a half. Monday was good. The young man, Kuba, he made me walk up and down with a cane. I'm not fond of the cane. It makes me look like a professor.
	Agent:  You'd make a distinguished professor. And the half?
	Patient:  Thursday I was too tired. I stopped after twenty minutes and he let me go. He said we'll do more next week.
	Agent:  That's reasonable. Did your balance feel better after Monday?
	Patient:  A little. I don't wobble so much in the kitchen. But the bathroom floor is slippery. I almost slid on Sunday.
	Agent:  Almost? You didn't fall?
	Patient:  I grabbed the towel rail.
	Agent:  Okay. That tells me the bathroom needs attention. Have the grab bars and the non-slip mat been installed yet?
	Patient:  Julia's husband said he'd do it. He has a drill. He's been saying it for three weeks.
	Agent:  (laughs) I'll let Julia know it's urgent, and if it doesn't happen by Monday, our program can send someone. We have a small home-safety service.
	Patient:  Don't tell him that. He'll be offended. Tell Julia to tell him I said it's urgent.
	Agent:  Diplomatic. I'll do that. Now, blood sugar. Are you still measuring in the mornings?
	Patient:  Every morning. Julia sees to it. It was 7.9 on Monday, 8.6 on Wednesday... what was today? Julia?
	Caregiver:  (from further away) 9.1, Dad. And Thursday was 10.2 after the visit with Uncle Staszek, the one with the cake.
	Patient:  It was a small cake.
	Caregiver:  It was a third of a cake, Dad.
	Agent:  (laughs) Okay, that explains Thursday. I'll note those readings. Mr. Nowak, are you feeling any extra thirst, blurry vision, anything unusual?
	Patient:  The vision, actually. Left eye. Everything is a bit foggy, like looking through a dirty window. But that's the cataract, they told me.
	Agent:  Right, and that connects to the future appointments. Let's go through what's coming up. Do you have your calendar?
	Patient:  Julia has the calendar. I have the memory of an elephant, but only for things from 1985.
	Agent:  Then let me read it to you and Julia can correct me. First, the echocardiogram, the heart ultrasound, is scheduled for next Wednesday at 10:30. It's the one that checks how well your heart is pumping. It's painless, you just lie there while they move a probe over your chest. It takes about forty minutes.
	Patient:  Cold gel. I remember. Last time they didn't warm it up.
	Agent:  I'll mention that to them. Next, the cardiology consultation with Dr. Wiśniewska, two days after that, on Friday. She'll review the echo and probably adjust your medication.
	Patient:  I like her. She doesn't talk to me like I'm a child.
	Agent:  Good. Then the cataract surgery. The date is still the 24th of next month, left eye first. Before that, you need a pre-operative check-up with the eye clinic, and they'll want a note from your cardiologist that your heart is stable enough for the procedure.
	Patient:  And if the heart isn't "stable"?
	Agent:  Then they might postpone it a bit, until your fluid is under control. That's another reason to take the water pill properly. It's not just about the swelling. It's also about getting your eye done on time.
	Patient:  Hm. That's a better argument than "because I said so."
	Agent:  (laughs) I'll use it more often. One more thing: since it's a day procedure, you'll need someone with you. Julia, can she take that day off?
	Caregiver:  I already asked my boss, it's fine. But I could use help with transport for the echo. I work that morning and can't leave.
	Agent:  That we can organize. We have a transport service for medical visits. Mr. Nowak, would you be comfortable going with a driver, and would you need someone to walk you in?
	Patient:  A driver is fine. But please not the one who talks about politics the whole way. Last time I wanted to jump out at the traffic lights.
	Agent:  (laughs) I'll request a quiet one. I'll write "prefers quiet driver, needs arm to the entrance."
	Patient:  Excellent. You should be a minister.
	Agent:  Last topic before I let you go. Mr. Nowak, how have you been in yourself, your mood? You've had a lot of changes lately, the fall, being home more, less independence.
	Patient:  (pause) It's... hard sometimes. I used to fix everything. Now I sit and watch my daughter fix everything. I don't like being a burden.
	Agent:  You're not a burden, though I understand why it feels that way. Thank you for saying it. Is there anything that makes the days feel better?
	Patient:  My grandson comes on Sundays. He's teaching me chess on the tablet. He beats me and laughs. It's the best part of the week.
	Agent:  That sounds wonderful. And would you like me to ask whether the program's volunteer could visit once a week, just to chat or play cards? Some people find it nice, others don't. No pressure.
	Patient:  Cards, yes. Not chess. I have enough humiliation from the child.
	Agent:  Cards it is. Okay, let me summarize so we're all on the same page. Today, the nurse calls you about the weight gain, the swelling, and the night breathlessness, and asks the doctor about moving the water pill to the morning. This week, the bathroom grab bars get installed. Next Wednesday, the echo with a quiet driver. Friday, the cardiology visit. Physiotherapy continues, and you'll try to do the full session. And I'll look into a card-playing volunteer. Did I miss anything?
	Patient:  The pickles.
	Agent:  (laughs) Ah. The pickles. What about them?
	Patient:  Julia found them. I'd like to negotiate. Two a week.
	Agent:  Let's discuss that with the nurse, maybe a small portion once in a while, but not behind the bread box. And if your weight goes up more than a kilo overnight, or the breathlessness gets worse, call the number on the card right away, or emergency services if you can't breathe. Okay?
	Patient:  Okay, okay. You're like my late wife.
	Agent:  I'll take that as a compliment. Could you put Julia back on for a minute?
	Patient:  Julia! She wants you. Take the phone. I'm going to find my glasses.
	Caregiver:  I'm here. That went better than usual. He actually admitted the night thing.
	Agent:  He did, and he told me the water pill wakes him up, which explains a lot. Could you send me the weight sheet photo later today, and I'll have the nurse call within the hour?
	Caregiver:  Sure. And thanks, Marta. Really.
	Agent:  Of course. Take care, Julia. Talk next Friday, or sooner if anything changes.
	Caregiver:  Will do. Bye!
"""
