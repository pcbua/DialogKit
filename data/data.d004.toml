source_user_prompt = """
Generate a long story (3000 words) about seven animals:
	Hedgehog Harry,
	Blue Jay Benny,
	Turtle Tom,
	Duck Daisy,
	Fox Felix,
	Frog Frankie,
	Squirrel Sammy.
A story for children that begins in a sunny clearing.
The animals first meet and talk in small groups of two or three. Then it starts raining, and everyone takes shelter under a large oak tree. From there, they set off on an expedition in several groups. During the storm, everyone gets lost. They search the forest and meet again. Describe who meets whom, one by one, finding more and more animals. Each animal in the forest finds a funny forest object (e.g., a broken stick, a green pine cone, or a crooked stone), and when the other animals find it, it trades it for another object. The animals sometimes talk – funny dialogue. They exchange objects from time to time and say funny things.
Use simple language, add some color and flavor.
Feel free to invent facts. Make sure the story and its dialogue are coherent and lighthearted, with plenty of variation and humor.
Name the animals either by name, species, or both name and species. For example: Harry, Hedgehog, Harry Hedgehog, Harry the Hedgehog.
Use raw text. No MarkDown.
"""
characters = [
    "Hedgehog | Harry",
    "Blue Jay | Benny",
    "Turtle | Tom",
    "Duck | Daisy",
    "Fox | Felix",
    "Frog | Frankie",
    "Squirrel | Sammy",
]
text = """
THE SEVEN FRIENDS AND THE MUDDLED MUSEUM

Once upon a sunny morning, the Whispering Woods woke up yawning. The sun poked its golden nose over the treetops. The dew sparkled like spilled sugar. In the middle of the woods lay a round, grassy clearing, full of buttercups and bumblebees, and it was the best place in the world for a good chat.

The first to arrive was Harry the Hedgehog. He came trundling out of the bushes, with his prickles full of dry leaves.

\"Good morning, clearing!\" he sang. \"Good morning, grass! Good morning, that-bit-of-grass-that-tickles!\"

\"You've got half a bush on your back,\" said a voice from above.

Harry looked up. On a low branch sat Benny the Blue Jay, as blue as a summer sky, with a crest that stuck straight up like a very important hat.

\"It's not a bush,\" said Harry. \"It's my breakfast. I'm saving it for later.\"

\"Your breakfast is a leaf,\" said Benny.

\"It's a leaf with a snail on it,\" said Harry proudly. \"The snail is called Gerald. Say hello, Gerald.\"

Gerald said nothing, because he was a snail. Benny fluttered down and landed on Harry's head, which was very brave of him, because it was prickly.

\"Ow,\" said Benny. \"Ow, ow. I forgot you were a hedgehog all over.\"

\"I'm even a hedgehog on top,\" said Harry. \"That's what makes me so good at it.\"

Meanwhile, down by the edge of the clearing, where the grass turned soggy and the soggy turned into a pond, three friends were having a very slow morning.

Turtle Tom was lying on a flat stone, with his eyes half closed. Duck Daisy was paddling in circles beside him, and Frankie the Frog was sitting on a lily pad, trying to catch a fly with his tongue.

\"Missed it again,\" sighed Frankie. \"That fly is faster than a rumor.\"

\"Have you tried being quicker?\" asked Daisy.

\"Have you tried being quieter?\" said Frankie. \"Every time I aim, you go quack-quack-quack, and the fly leaves.\"

\"I don't quack,\" said Daisy, ruffling her feathers. \"I speak with feeling.\"

Tom opened one eye. \"I once beat a hare in a race,\" he said.

\"That was your grandfather,\" said Daisy.

\"It was a family race,\" said Tom. \"I was there in spirit. I was in his shell.\"

\"You weren't born yet!\" laughed Frankie, and he fell off his lily pad into the water with a plop.

On the far side of the clearing, under a dandelion as tall as a lamp post, two more friends were having a very sneaky morning. Felix the Fox had his nose in the air and his tail in a perfect curl. Beside him, Sammy the Squirrel was hopping up and down, because Sammy never did anything else.

\"I have a plan,\" whispered Felix.

\"Is it the cheese plan?\" asked Sammy.

\"There is no cheese plan. Foxes don't eat cheese.\"

\"Then is it the acorn plan?\"

\"Squirrels have acorn plans,\" said Felix. \"Foxes have clever plans. And my plan is this: today we go and find the end of the rainbow.\"

Sammy stopped hopping, which was very rare. \"But there's no rainbow. The sky is blue and boring.\"

\"Then we wait for one,\" said Felix. \"A fox is a patient creature.\"

\"You were not patient yesterday,\" said Sammy. \"You chased your own tail for an hour.\"

\"It was a very interesting tail,\" said Felix, with great dignity.

Just then, a small gray cloud floated over the sun. It looked a bit like a sheep. Then another cloud arrived, a bit like a bigger sheep. Then a whole flock of sheep-shaped clouds came along and sat down on the sky.

\"Oh dear,\" said Tom, who had a good sense for weather, partly because his shell sometimes got wet.

Plip.

A raindrop landed on Harry's nose.

Plip, plop, plip!

\"RAIN!\" shouted Benny, and he flapped into the air, with his crest drooping.

\"Run!\" cried Daisy. \"Waddle! Whatever it is that we do!\"

\"To the oak!\" said Felix.

Everyone knew which oak he meant. At the edge of the clearing stood the biggest, oldest tree in the Whispering Woods. It was so wide that seven animals could stand around it holding hands, if they had hands, and so tall that its top was always in a cloud. They called it the Great Oak, and it had a hollow bottom, big as a room, with a floor of soft dry moss.

One by one, they scurried in. Harry rolled in like a ball. Benny dived in like an arrow. Daisy waddled and quacked. Frankie hopped and splashed. Sammy shot up the trunk and then, realizing it was the wrong way, shot back down. Felix trotted in with his tail held high over the wet. Last of all came Tom, who walked at his normal speed, and so was the only one who got properly rained on.

\"Hello,\" he said, dripping. \"I'm here. Did I miss anything?\"

\"Yes,\" said Frankie. \"The rain. We've all had it. You can have yours now.\"

Outside, the rain drummed on the leaves. Inside, the seven friends sat in a cozy, damp circle.

\"Well,\" said Felix, \"since we're all here, I have an announcement. Today we are going on an expedition.\"

\"In this?\" said Daisy, nodding at the rain.

\"Rain is good for ducks,\" said Felix.

\"I'm a duck, and I say it isn't always good.\"

\"Rain is good for frogs,\" said Frankie. \"I'll go.\"

\"Rain is bad for hedgehogs,\" said Harry. \"We get soggy and then we smell like wet carpets.\"

\"The expedition,\" said Felix grandly, \"is to Mushroom Hill. When the rain stops, the sun will come out, and there will be a rainbow. Rainbows always end on top of Mushroom Hill. Everybody knows that.\"

\"Everybody knows that?\" said Benny. \"I didn't know that.\"

\"Everybody who is a fox knows that,\" said Felix.

\"And at the end of the rainbow,\" said Sammy, wide-eyed, \"there is a pot of gold!\"

\"Or a pot of soup,\" said Daisy, who liked soup.

\"Or a pot of acorns,\" said Sammy.

\"Or a pot of flies,\" sighed Frankie happily.

They argued for a while about what was in the pot, and nobody could agree, so they decided the best way to find out was to go and look. But the hill was far away, and the path was muddy, and there were seven of them. So they split into three groups. Harry and Tom would go together along the low path, because they were the slowest. Benny, Daisy, and Frankie would take the middle path through the ferns. Felix and Sammy would take the high path over the roots, because Felix liked to be first and Sammy liked to be up.

\"We will meet on Mushroom Hill!\" announced Felix. \"At the top! When the rainbow comes out!\"

\"And if we get lost?\" asked Harry.

\"We won't get lost,\" said Felix. \"I'm a fox.\"

That was the last sensible thing anyone said that day.

Because as soon as they left the Great Oak, the sky went from gray to grumpy. The wind began to blow. The trees began to creak and sway. The rain turned from a plip into a ploop, then into a swoosh, and a flash of lightning lit up the whole forest like a camera.

CRRRRACK-BOOM!

\"Was that thunder?\" yelled Benny.

\"I think it was Gerald!\" Harry yelled back. \"He's afraid of the dark!\"

Then the wind picked up a pile of leaves and whirled them into the air like confetti. Harry and Tom couldn't see each other. Benny, Daisy, and Frankie got blown in three different directions. Sammy leaped from root to root and landed in a puddle, and by the time he looked up, Felix had vanished into the gloom.

Seven friends, seven different places, and not one of them knew where they were.

Harry was the first to calm down. He sat under a fern and counted his prickles, which always helped.

\"One, two, three, four, five hundred and three,\" he said. \"Well, I've lost a prickle. Never mind. Hello, what's this?\"

Right beside his foot, half buried in the mud, lay a pine cone. But it was no ordinary pine cone. It was bright, grassy green, the greenest cone in all the forest.

\"Ha!\" said Harry. \"A green pine cone! I have never seen one of those. Maybe it's an unripe one. Maybe it's from a pine tree that got seasick.\"

He tucked it under his arm and walked on, through the rain.

Not far away, Tom was plodding slowly along the low path. He was alone, but he wasn't scared, because he always carried his house with him.

\"Left foot,\" he muttered. \"Right foot. Other right foot. Oh, there's a stone.\"

It was a crooked stone, bent in the middle like a smile that had gone wrong. It looked as if it was thinking about something.

\"Excuse me,\" said Tom politely. \"Are you somebody's lost property?\"

The stone said nothing.

\"I'll take that as a yes,\" said Tom, and he picked it up, which took a while.

At that moment, a very wet hedgehog came bumbling out of the ferns.

\"TOM!\" yelled Harry.

\"HARRY!\" yelled Tom.

\"You're here!\"

\"I'm always here,\" said Tom. \"I'm only slow in getting there.\"

They hugged, which was tricky, because of the prickles, and then they looked at each other's treasures.

\"What have you got?\" asked Harry.

\"A crooked stone. It's very wise. It hasn't said a word.\"

\"I've got a green pine cone,\" said Harry. \"It's very strange. Swap?\"

\"Swap,\" said Tom, and they traded. Harry got the stone. Tom got the cone, and he promptly put it on top of his shell, like a little green hat.

\"How do I look?\" he asked.

\"Like a very small, very slow pine tree,\" said Harry.

\"Wonderful,\" said Tom.

Meanwhile, in the middle of the ferns, a very soggy blue jay was perched on a branch, grumbling.

\"I should have stayed in the oak,\" said Benny to himself. \"I should have stayed home. I should have stayed an egg.\"

Then he noticed something shiny stuck in the mud below. He flew down, pecked it out, and found it was a spoon. It was old, bent, and a little rusty, the kind of spoon a picnicking bear might drop and never miss.

\"A spoon!\" said Benny. \"In the middle of the forest! Who eats soup out here?\"

\"I do!\" said a voice. \"Quack! Did somebody say soup?\"

Out of a bush came Daisy, with her feathers stuck up in all directions, and one very twiggy thing in her beak. It was a broken stick, with a bump in the middle and a single leaf on the end, like a wand that had lost its magic.

\"Benny!\" she said, dropping the stick. \"I'm so glad to see you! I've lost Frankie, I've lost the path, and I've found a stick. It's the only good thing that's happened to me today.\"

\"I found a spoon,\" said Benny.

\"Let me see!\" said Daisy, and her eyes lit up. \"A spoon! Now we only need soup.\"

\"It's raining,\" said Benny. \"Technically, the whole forest is soup.\"

\"A very thin soup,\" said Daisy.

\"A very big soup,\" said Benny.

They swapped: Benny took the stick and held it like a magic wand, and Daisy took the spoon and held it like a queen. Then Benny waved the stick at a puddle.

\"Abracadabra!\" he cried. \"Turn into a pond!\"

The puddle stayed a puddle.

\"It's a very stubborn puddle,\" said Daisy.

They hadn't walked ten steps when they heard a squeaky, croaky sound from under a toadstool.

\"Help!\" it said. \"I'm stuck! I'm stuck in a puddle that is too small for me and too big for a bath!\"

It was Frankie. He had jumped into a hollow filled with rainwater, but the rainwater had filled with mud, and now he was wearing a mud coat. In one hand he was holding a shiny round thing.

\"A bottle cap!\" said Frankie, waving it. \"I found it on the bottom! It's the best thing I've ever found, and I've found three flies and a button.\"

Daisy pulled him out with a loud schlorp.

\"Frankie!\" said Benny. \"You're okay!\"

\"I'm brown!\" said Frankie. \"But I'm okay.\"

They all admired the bottle cap, and then Frankie looked at the spoon.

\"Ooh,\" he said. \"A spoon is better than a cap. With a spoon, I could eat flies much more politely.\"

\"With a cap,\" said Daisy, \"you could wear it on your head.\"

\"Swap!\" they both said.

So Daisy took the cap and put it on her head, where it sat like a tiny silver crown. Frankie took the spoon, wiped it on a leaf, and held it up like a very fancy microphone.

\"Testing, testing,\" he said. \"Frankie the Frog speaking. Hello, forest. Please send flies.\"

The three friends continued together through the rain, and soon they heard a rustle, a crunch, and a loud \"Ahhh-CHOO!\"

It was Felix and Sammy, coming from the other side, with the fox's beautiful tail now looking like a wet mop.

\"Look who it is,\" said Felix, pretending he wasn't relieved. \"I was just about to find you. I knew exactly where I was going.\"

\"You were going round in a circle,\" said Sammy. \"We passed the same tree five times. I know, because I counted the squirrels on it, and there were always the same three, and they started waving.\"

Felix was holding something enormous: a huge, fluffy feather, longer than his tail, as white as a cloud.

\"I found it on the ground,\" he said. \"It's from a giant bird. Maybe a goose. Maybe a dragon. Maybe a very large duck.\"

\"I am NOT that large,\" said Daisy.

Sammy was holding a mushroom cap, round and red with white spots, and with a hole right through the middle.

\"It's a hat for a mouse,\" said Sammy. \"Or a very small bagel. I haven't decided.\"

\"Let me see that,\" said Felix. \"A mushroom with a hole! A hat with a window! That's the cleverest hat I've ever seen. Swap?\"

\"But I want the feather,\" said Sammy. \"It's so tickly.\"

So Felix and Sammy swapped. Felix put the mushroom on his head, with his ears sticking out through the hole, and Sammy waved the feather about, giggling.

\"Stop that!\" said Felix. \"You're tickling my nose!\"

\"It's not me, it's the feather!\"

\"Then tell the feather to stop!\"

\"Stop, feather!\" said Sammy. The feather did not stop. Felix sneezed so hard that the mushroom flew off his head and landed on Frankie, who said, \"Hey, I wasn't ready for that!\"

Now the five of them stood together: Benny, Daisy, Frankie, Felix, and Sammy. They had found each other, but they had not found the rainbow, and two friends were still missing.

\"I'll look for them,\" said Benny, flapping up. \"I'm a bird. I have the high view.\"

\"You have a stick,\" said Daisy.

\"A bird with a stick has an even higher view,\" said Benny, and he flew off in the rain. Soon he came back, flapping so hard he nearly lost the stick.

\"I can see them!\" he cried. \"A green hat and a prickly ball, walking along together! They're on the low path, near the big mossy log!\"

\"That's Tom and Harry!\" said Daisy. \"Come on!\"

They hurried off, through the wet and the muddy and the very squelchy, and soon they all saw a very small pine tree, walking very slowly beside a very large hedgehog.

\"Hello!\" shouted everyone at once.

\"Hello!\" shouted Harry. \"We found a green pine cone, and a crooked stone, and each other, and now we've found you!\"

What a happy reunion that was. There was hugging and splashing and several squeals from Harry, whose prickles had accidentally poked Felix. Then, because they had so many objects, they all started comparing.

\"Hold on,\" said Benny. \"This isn't fair. Everyone has something nice, except me. I have a stick.\"

\"It's a very good stick,\" said Tom politely. \"It has a bump in it.\"

\"I want a cone,\" said Benny. \"A green cone would make me look like a woodland king.\"

\"Then swap with me,\" said Tom, and he handed over the cone and took the stick, which he used as a walking cane. \"Now I look like a very distinguished turtle.\"

\"I want the spoon!\" said Harry, who liked tidy things. He swapped his crooked stone for Frankie's spoon, and Frankie took the stone, held it up to his ear, and said, \"I think I can hear the ocean. Or a very small cow.\"

\"I want the mushroom!\" said Daisy to Felix. \"I could use it as an umbrella.\"

\"And I want the bottle cap!\" said Felix. \"I need a crown. It's not every day a fox leads an expedition.\"

\"You led us in circles,\" said Sammy.

\"The best leaders know how to find the most interesting route,\" said Felix, and so Daisy took the mushroom, and Felix took the cap, balancing it on his head like a very small silver bowl.

\"And I'll have the cone,\" said Sammy to Benny, \"because it looks like something I could hide and then forget about.\"

\"And I'll have the feather,\" said Benny, \"because it matches my crest.\"

So Sammy took the cone and hid it in his cheek, where it did not fit, and Benny took the giant feather and stuck it in his crest, making him look like a very proud, very blue peacock.

And that was when something wonderful happened. The rain softened, from a swoosh to a sprinkle, and from a sprinkle to a few last plips. The wind went quiet. The thunder rolled away to bother somebody else. Then the clouds parted, and a long, golden sunbeam shone straight down on the seven friends, and with it came a great shimmering rainbow, arching over the whole forest from the Great Oak to the top of Mushroom Hill.

\"The rainbow!\" cried Sammy.

\"It really does end on Mushroom Hill!\" said Frankie.

\"I told you,\" said Felix.

\"You did not,\" said Daisy. \"You said it ends under a big oak, then you said a hill, then you said maybe a pond.\"

\"It was an excellent guess,\" said Felix. \"And it came true. Which makes me right.\"

They all hurried up Mushroom Hill. Tom took a while, but nobody minded, because the rainbow was not going anywhere. At the top, instead of a pot of gold, they found a large flat rock, perfectly dry, with a view over the whole forest, sparkling and fresh and clean.

\"No gold,\" said Sammy sadly.

\"No soup,\" said Daisy sadly.

\"No flies,\" said Frankie sadly.

\"But look what we've got,\" said Harry. \"Look at all of us.\"

They looked at one another. Harry held a spoon. Tom held a stick. Benny wore a feather. Daisy carried a mushroom. Frankie hugged a stone. Felix wore a bottle cap. Sammy had a pine cone stuffed in his cheek. They were all muddy and soggy, and they were all grinning from ear to ear, or beak to beak.

\"You know what?\" said Tom, in his slow, wise way. \"I think we should keep these things. We should make a museum.\"

\"A museum?\" said Benny.

\"The Museum of Muddled Things,\" said Tom. \"We'll put it under the Great Oak, and we will write a sign. 'Welcome to the best collection of very odd objects in the whole Whispering Woods.'\"

\"And I'll be the guide!\" said Felix.

\"And I'll be the guard!\" said Harry, bristling happily.

\"And I'll be the one who forgets where we put everything!\" said Sammy.

And so they did. They all walked back down the hill together, in a long, happy line, with the rainbow glowing above them. Under the Great Oak, they put every object on a little shelf of moss, and Tom wrote a sign with his stick: PLEASE DO NOT LICK THE STONE.

\"Why would anyone lick the stone?\" asked Daisy.

\"Because,\" said Frankie, \"I already have.\"

And from that day on, every animal in the Whispering Woods came to visit the Museum of Muddled Things. They would laugh at the crooked stone and the green pine cone, and gasp at the giant feather, and ask who had lost the spoon. And the seven friends would tell the story of the storm, the rainbow, and the great swapping day, and every time they told it, the story got a little bit bigger, the thunder got a little bit louder, and Gerald the snail got a little bit braver.

The End.
