# Runs the test suite on every pull request and on every change of main.
# With GitHub Flow all changes arrive as pull requests, so a broken change is caught before it is merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # uv reads .python-version and pyproject.toml, installs everything and runs the same command as on a laptop
      - run: uv run pytest
