[project]
name = "DialogKit"
version = "0.1.0"
description = "Generate, manage, and analyze dialogues in Python. Create synthetic multi-party conversations, store them in a clean structured format, and run analytics on turns, speakers, and content. Ideal for NLP research, chatbot testing, and training-data pipelines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.42.0",
    "requests>=2.34.2",
    "toml>=0.10.2",
    "tomli-w>=1.2.0",
]

# Tools needed only for development, not for running the scripts. 'uv run' installs this group automatically.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

# Run all tests with: uv run pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# 'utils' holds plain scripts, not a package; this lets the tests import them by name (e.g. 'import useful_utils')
pythonpath = ["utils", "tests"]
# tests marked 'live' talk to a real LLM server, so they are left out unless asked for
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: needs a running LLM server; run with: uv run pytest -m live",
]
